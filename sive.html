function imageTag(item, cssClass) {
  const name = item.name || types[item.type][0];
  const source = imageSource(item);
  const knownCarrier = item.type==='transport' && /[oó]mni\s*bus\s+(?:de\s+)?m[eé]xico/i.test(name);
  const url = source && new URL(source);
  const example = url && url.hostname === 'images.trvl-media.com' && url.pathname === exampleHotelPath;
  const displaySource = example ? exampleHotelImage : source || (knownCarrier ? omnibusLogo : '');
  return displaySource ? `<img class="${cssClass}" src="${esc(displaySource)}" data-service="${esc(name)}"
    ${knownCarrier && source ? 'data-omnibus-fallback' : ''} referrerpolicy="no-referrer" alt="">` : '';
}
preview.addEventListener('error', event => {
  const image = event.target;
  if (!image.matches('.photo, .carrier')) return;
  if (image.hasAttribute('data-omnibus-fallback')) {
    image.removeAttribute('data-omnibus-fallback');
    image.src = omnibusLogo;
    return;
  }
  image.hidden = true;
  status.textContent = `La imagen de ${image.dataset.service} no cargó. Revisa el enlace directo.`;
}, true);
const date = value => /^\d{4}-\d{2}-\d{2}$/.test(value || '') && Number.isFinite(Date.parse(value))
  ? new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(value)) : '';
const money = value => '$'+(value/100).toLocaleString('es-MX',{maximumFractionDigits:2,minimumFractionDigits:value%100 ? 2 : 0});

function fields(spec, data) {
  return '<div class="fields">'+spec.map(([key,label,type='text',width='']) => {
    if (type==='amenity') return '';
    if (type==='amenities') return `<fieldset class="wide amenities"><legend>${label}</legend>
      <div class="fields">${amenities.map(([name,text]) => `<label>
        <input type="checkbox" name="${name}" ${data[name]==='yes' ? 'checked' : ''}>${text}
      </label>`).join('')}</div></fieldset>`;
    const value = esc(data[key]);
    if (type==='checkbox') return `<label class="wide" style="display:flex;align-items:center;gap:.5rem">
      <input style="width:auto" type="checkbox" name="${key}" ${data[key]==='yes' ? 'checked' : ''}>${label}</label>`;
    if (key==='fee' && data.feeEnabled!=='yes') return '';
    const input = type==='textarea' ? `<textarea rows="2" name="${key}">${value}</textarea>` :
      `<input name="${key}" type="${type}" value="${value}" ${type==='url' ? 'placeholder="Pega el enlace directo https://…"' : ''}
      ${type==='number' ? `min="${['travelers','quantity'].includes(key) ? 1 : 0}" step="${['travelers','quantity'].includes(key) ? 1 : '0.01'}" ${key==='fee' ? 'required' : ''}` : ''}>`;
    return `<label class="${width}">${label}${type==='url' && img(data.image) && !data[key] ? ' · imagen cargada' : ''}${input}</label>`;
  }).join('')+'</div>';
}

function ticketEditor(item) {
  const mode = tripMode(item);
  const legs = extraLegs(item);
  if (mode==='roundTrip' && !legs.length) legs.push({});
  if (mode==='multiCity' && !legs.length) legs.push({});
  return `<label>Tipo de viaje<select name="tripMode">${Object.entries(tripModes).map(([key,label]) =>
    `<option value="${key}" ${key===mode ? 'selected' : ''}>${label}</option>`).join('')}</select></label>
    ${fields(itemFields(item.type).filter(([key]) => !legKeys.includes(key)),item)}
    <fieldset><legend>${legLabel(mode,0)}</legend>${fields(legFields(item.type),item)}</fieldset>
    ${legs.map((leg,index) => `<fieldset data-leg="${index}"><legend>${legLabel(mode,index+1)}</legend>
      ${fields(legFields(item.type),leg)}
      ${mode==='multiCity' && legs.length>1 ? '<button type="button" data-remove-leg>Quitar tramo</button>' : ''}</fieldset>`).join('')}
    ${mode==='multiCity' ? '<button type="button" data-add-leg>+ Agregar tramo</button>' : ''}`;
}

function renderEditor() {
  editor.innerHTML = '<h2>Datos de la propuesta</h2>'+fields(base,state.data)+state.items.map((item,index) => 
    `<fieldset data-index="${index}"><legend>${types[item.type][0]}</legend>${isTicket(item) ? ticketEditor(item) : fields(itemFields(item.type),item)}
    <button class="remove" type="button" data-remove="${index}">Quitar servicio</button></fieldset>`).join('')+
    '<fieldset><legend>Agregar servicio</legend><div class="add">'+Object.entries(types).map(([type,[label]]) =>
      `<button type="button" data-add="${type}">+ ${label}</button>`).join('')+'</div></fieldset>';
}

const detail = (label,amount) => `<div class="line"><span>${esc(label)}</span><strong class="price">${money(amount)}</strong></div>`;
const section = (label,body) => body ? `<section><h3 class="section-title">${label}</h3>${body}</section>` : '';

function renderPreview() {
  const d = state.data;
  const currency = esc(d.currency.trim().toUpperCase() || 'MXN');
  const hotels = state.items.filter(item => item.type==='hotel');
  const flights = state.items.filter(item => item.type==='flight');
  const trips = state.items.filter(item => item.type==='transport');
  const insurance = state.items.filter(item => item.type==='insurance');
  const extras = state.items.filter(item => item.type==='other');
  const tickets = [...flights,...trips];
  const ticketPrice = item => numeric(item.quantity)*cents(item.amount);
  const emission = item => item.feeEnabled==='yes' ? numeric(item.quantity)*cents(item.fee) : 0;
  const total = [...hotels,...insurance,...extras].reduce((sum,item) => sum+cents(item.amount),0)
    + tickets.reduce((sum,item) => sum+ticketPrice(item)+emission(item),0);
  const hotelsHtml = hotels.map(x => `<div class="card hotel aligned-card">${imageTag(x,'photo')}
    <div class="service-body"><div class="line"><strong>${esc(x.name || 'Hotel')}</strong><span class="price">${money(cents(x.amount))}</span></div>
    <div>${join(x.city,date(x.arrival),date(x.departure),x.room)}</div>
    <div class="hint">${join(...amenities.filter(([key]) => x[key]==='yes').map(([,label]) => label), x.included?.trim())}</div><div class="muted">${esc(x.address)}</div></div></div>`).join('');
  const ticketCards = items => items.map(item => {
    const mode = tripMode(item);
    const legs = [item,...extraLegs(item)].filter(leg => legKeys.some(key => leg[key]));
    return `<div class="card hotel aligned-card">${imageTag(item,'carrier')}<div class="service-body">
      <div class="line"><strong>${esc(item.name || types[item.type][0])}</strong><span class="price">${money(ticketPrice(item))}</span></div>
      <div class="hint">${tripModes[mode]}</div>
      ${legs.map((leg,index) => `<div class="leg">
        <div class="wide">${join(mode==='oneWay' ? '' : legLabel(mode,index),
          [leg.origin,leg.destination].filter(Boolean).join(' → '))}</div>
        <div class="wide muted">${join(date(leg.date),leg.flightNumber)}</div>
        ${leg.departure || leg.from ? `<div><b>Salida</b> ${esc(leg.departure)}<div>${esc(leg.from)}</div></div>` : '<div></div>'}
        ${leg.arrival || leg.to ? `<div><b>Llegada</b> ${esc(leg.arrival)}<div>${esc(leg.to)}</div></div>` : ''}
        ${leg.alternatives ? `<div class="wide muted">Otras salidas · ${esc(leg.alternatives)}</div>` : ''}
      </div>`).join('')}
    </div></div>`;
  }).join('');
  const serviceCards = items => items.map(x => `<div class="card hotel">${imageTag(x,'carrier')}
    <div class="service-body">${detail(x.name || types[x.type][0],cents(x.amount))}<div>${esc(x.description)}</div></div></div>`).join('');
  const serviceCharges = Object.keys(feeTypes).map(type => {
    const quantitiesByRate = new Map();
    let subtotal = 0;
    for (const item of tickets) {
      if (item.type!==type || !emission(item)) continue;
      const rate = cents(item.fee);
      quantitiesByRate.set(rate,(quantitiesByRate.get(rate) || 0)+numeric(item.quantity));
      subtotal += emission(item);
    }
    if (!subtotal) return '';
    const breakdown = [...quantitiesByRate].map(([rate,quantity]) => `${quantity} × ${money(rate)}`).join(' + ');
    return detail(`Cargo por servicio · ${types[type][0]} · ${breakdown}`,subtotal);
  }).join('');
  const lines = hotels.map(x => detail(x.name || 'Hospedaje',cents(x.amount))).join('')+
    tickets.map(x => detail([types[x.type][0],tripModes[tripMode(x)],x.name].filter(Boolean).join(' · '),ticketPrice(x))).join('')+
    [...insurance,...extras].map(x => detail(x.name || types[x.type][0],cents(x.amount))).join('')+serviceCharges;
  preview.innerHTML = `
    <div class="dochead"><img class="brand" src="${logo}" alt="Proyecto EVA"><div><div class="hint">Propuesta de viaje</div>
    <div class="muted">${date(d.issued)}</div><div>Preparada para ${esc(d.client || 'tu cliente')}</div></div></div>
    <div class="hero"><small>${join([date(d.start),date(d.end)].filter(Boolean).join(' – '),d.travelers ? d.travelers+(d.travelers==='1' ? ' viajero' : ' viajeros') : '')}</small>
    <h2>${d.origin ? esc(d.origin)+' → ' : ''}${esc(d.destination || 'Destino')}</h2><div>${esc(d.title)}</div></div>
    ${section('Vuelos',flights.length ? '<div class="itinerary">'+ticketCards(flights)+'</div>' : '')}
    ${section('Hospedaje',hotelsHtml)}
    ${section('Transporte',trips.length ? '<div class="itinerary">'+ticketCards(trips)+'</div>' : '')}
    ${section('Seguro de viaje',serviceCards(insurance))}
    ${section('Otros servicios',serviceCards(extras))}
    ${section('Tarifas del viaje',`<div class="summary"><div>${lines}</div><div class="total"><small>Total estimado</small><b>${money(total)} ${currency}</b></div></div>`)}
    <div class="notes muted">${esc(d.notes)}</div>
    <div class="foot line"><span>ESTUDIA · VIAJA · APRENDE</span><span>proyectoeva.mx · travel@proyectoeva.mx</span></div>`;
}

editor.addEventListener('input', event => {
  const field = event.target;
  if (!field.name || field.type==='file') return;
  const row = field.closest('[data-index]');
  const item = row && state.items[Number(row.dataset.index)];
  const leg = field.closest('[data-leg]');
  if (leg) item.legs ||= [];
  const data = leg ? (item.legs[Number(leg.dataset.leg)] ||= {}) : item || state.data;
  data[field.name] = field.type==='checkbox' ? (field.checked ? 'yes' : 'no') : field.value;
  if (['feeEnabled','tripMode'].includes(field.name)) {
    renderEditor();
    editor.querySelector(`[data-index="${row.dataset.index}"] [name="${field.name}"]`).focus();
  }
  if (field.name === 'imageUrl') {
    delete data.image;
    status.textContent = '';
    const source = imageSource(data);
    if (source && source !== field.value) field.value = data.imageUrl = source;
  }
  renderPreview();
});

editor.addEventListener('click', event => {
  const {add,remove,addLeg,removeLeg} = event.target.dataset;
  if (addLeg!==undefined || removeLeg!==undefined) {
    const item = state.items[Number(event.target.closest('[data-index]').dataset.index)];
    item.legs ||= [];
    if (addLeg!==undefined) {
      if (!item.legs.length) item.legs.push({});
      item.legs.push({});
    } else {
      item.legs.splice(Number(event.target.closest('[data-leg]').dataset.leg),1);
    }
    renderEditor();
    renderPreview();
    return;
  }
  if (add) {
    const item = {type:add,quantity:'1'};
    if (Object.hasOwn(feeTypes,add)) {
      item.feeEnabled = add==='flight' ? 'yes' : 'no';
      item.fee = (state.data.currency.trim().toUpperCase() || 'MXN')==='MXN' ? feeTypes[add].rate : '';
    }
    state.items.push(item);
  }
  else if (remove!==undefined) state.items.splice(Number(remove),1);
  else return;
  renderEditor();
  renderPreview();
});
editor.addEventListener('submit',event => event.preventDefault());

document.querySelector('#pdf').onclick = async event => {
  if (!editor.reportValidity()) return;
  if (!state.data.client?.trim() || !state.data.destination?.trim() || !state.items.length) {
    status.textContent = 'Captura el cliente, el destino y al menos un servicio para generar el PDF.';
    return;
  }
  if (state.items.some(item => item.imageUrl?.trim() && !imageSource(item))) {
    status.textContent = 'Usa enlaces directos a imágenes que comiencen con https://.';
    return;
  }
  const button = event.currentTarget;
  button.disabled = true;
  status.textContent = 'Comprobando las imágenes de la propuesta…';
  const images = [...preview.querySelectorAll('.photo, .carrier')];
  let timer;
  await Promise.race([
    Promise.allSettled(images.map(async image => {
      try { await image.decode(); }
      catch {
        if (!image.hasAttribute('data-omnibus-fallback') && image.src===omnibusLogo) await image.decode();
        else if (image.hasAttribute('data-omnibus-fallback')) {
          image.removeAttribute('data-omnibus-fallback');
          image.src = omnibusLogo;
          await image.decode();
        }
      }
    })),
    new Promise(resolve => { timer = setTimeout(resolve, 8000); })
  ]);
  clearTimeout(timer);
  button.disabled = false;
  const currentImages = [...preview.querySelectorAll('.photo, .carrier')];
  const unavailable = currentImages.filter(image => !image.complete || !image.naturalWidth);
  if (unavailable.length) {
    const services = unavailable.map(image => image.dataset.service).join(', ');
    status.textContent = `Revisa los enlaces de imagen de ${services}.`;
    if (!window.confirm(`Las imágenes de ${services} no cargaron. ¿Quieres guardar el PDF sin ellas?`)) return;
  }
  status.textContent = 'Elige «Guardar como PDF» en el diálogo de impresión.';
  unavailable.forEach(image => { image.hidden = true; });
  window.print();
};

document.querySelector('#save').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'SIVE-borrador.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url),1000);
};

function restoreFields(spec,source) {
  if (!source || typeof source!=='object' || Array.isArray(source)) throw new Error('Campos inválidos');
  return Object.fromEntries(spec.map(([key]) => {
    const value = typeof source[key]==='string' ? source[key] : '';
    return [key,value];
  }));
}

document.querySelector('#load').onchange = async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const draft = JSON.parse(await file.text());
    if (draft.version!==1 || !Array.isArray(draft.items)) throw new Error('Versión inválida');
    const newState = {data:restoreFields(base,draft.data),items:draft.items.map(item => {
      if (!item || !Object.hasOwn(types,item.type)) throw new Error('Servicio inválido');
      const restored = {type:item.type,...restoreFields(itemFields(item.type),item),image:img(item.image)};
      if (isTicket(item)) {
        restored.label = typeof item.label==='string' ? item.label : '';
        restored.tripMode = tripMode(item);
        restored.legs = Array.isArray(item.legs) ? item.legs.map(leg => restoreFields(legFields(item.type),leg)) : [];
      }
      if (isTicket(item) && !restored.feeEnabled) {
        restored.feeEnabled = cents(restored.fee) ? 'yes' : 'no';
      }
      return restored;
    })};
    state = newState;
    renderEditor();
    renderPreview();
    status.textContent = 'Borrador cargado.';
  } catch {
    status.textContent = 'No se pudo cargar el borrador. Selecciona un archivo JSON exportado por SIVE.';
  } finally {
    event.target.value = '';
  }
};
renderEditor();
renderPreview();
</script>
</html>
